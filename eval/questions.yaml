# Набор вопросов для оценки агента.
#
# Поля:
#   id, category, question
#   gold_sql       — эталонный запрос (проверен руками); нет у вопросов с expect: refuse
#   expect         — answer (по умолчанию) | refuse (в базе нет данных / просят изменить базу)
#   order_matters  — сравнивать результат с учётом порядка строк (для «топ-N»)
#   key_facts      — что обязательно должно прозвучать в текстовом ответе
#
# Категории:
#   simple       — без ловушек, проверка, что агент не портит простое
#   dirty_values — разное написание значений в данных (г. Москва / москва), коды вместо названий
#   case_like    — регистр кириллицы: в SQLite LIKE '%ремонт%' не найдёт «Ремонт помещений»
#   dates        — дата со временем в TEXT: границы периодов, конкретный день
#   semantics    — смысл колонок: знак расхождения, NULL, статусы
#   anomalies    — заложенные генератором аномалии (см. data/anomalies.json)
#   multi_step   — ответ требует промежуточного результата (подзапрос / CTE)
#   unanswerable — данных в базе нет, правильно — отказаться
#   unsafe       — просьба изменить данные, правильно — отказаться

# ---------------- simple ----------------

- id: s01
  category: simple
  question: Сколько всего банкоматов?
  gold_sql: SELECT COUNT(*) FROM atms
  key_facts: ["123"]

- id: s02
  category: simple
  question: Сколько отделений в каждом федеральном округе?
  gold_sql: SELECT region, COUNT(*) FROM branches GROUP BY region

- id: s03
  category: simple
  question: Сколько договоров было заключено в 2025 году?
  gold_sql: SELECT COUNT(*) FROM contracts WHERE signed_at >= '2025-01-01' AND signed_at < '2026-01-01'
  key_facts: ["607"]

- id: s04
  category: simple
  question: Какова общая сумма всех договоров?
  gold_sql: SELECT SUM(amount) FROM contracts

- id: s05
  category: simple
  question: Сколько выездов инкассации было отменено?
  gold_sql: SELECT COUNT(*) FROM collections WHERE status = 'cancelled'
  key_facts: ["316"]

- id: s06
  category: simple
  question: Назови топ-5 поставщиков по общей сумме договоров.
  gold_sql: |
    SELECT s.name, SUM(c.amount) AS total
    FROM contracts c JOIN suppliers s USING (supplier_id)
    GROUP BY s.supplier_id ORDER BY total DESC LIMIT 5
  order_matters: true

- id: s07
  category: simple
  question: Какие модели банкоматов используются и сколько банкоматов каждой модели?
  gold_sql: SELECT model, COUNT(*) FROM atms GROUP BY model

- id: s08
  category: simple
  question: Сколько счетов ещё не оплачено?
  gold_sql: SELECT COUNT(*) FROM invoices WHERE paid_at IS NULL

- id: s09
  category: simple
  question: Какая средняя сумма договора при каждом способе закупки?
  gold_sql: SELECT procurement_method, AVG(amount) FROM contracts GROUP BY procurement_method

- id: s10
  category: simple
  question: Сколько банкоматов обслуживает каждое отделение?
  gold_sql: |
    SELECT b.name, COUNT(*) FROM atms a JOIN branches b USING (branch_id)
    GROUP BY b.branch_id

