# ---------------- semantics ----------------

- id: m01
  category: semantics
  question: Какова общая сумма недостач по всем выездам инкассации?
  # недостача = amount_counted < amount_declared; знак в ответе не важен (сравнение по модулю)
  gold_sql: |
    SELECT SUM(amount_declared - amount_counted) FROM collections
    WHERE amount_counted < amount_declared

- id: m02
  category: semantics
  question: У каких 5 маршрутов самые большие недостачи за второе полугодие 2025 года?
  gold_sql: |
    SELECT r.name, SUM(c.amount_counted - c.amount_declared) AS discrepancy
    FROM collections c JOIN routes r USING (route_id)
    WHERE c.collected_at >= '2025-07-01' AND c.collected_at < '2026-01-01'
    GROUP BY r.route_id ORDER BY discrepancy ASC LIMIT 5
  order_matters: true
  key_facts: ["КЗН-2"]

- id: m03
  category: semantics
  question: Какая в среднем сумма пересчитана в кассовом центре за один выезд инкассации?
  # NULL у несостоявшихся выездов: AVG их пропускает, COALESCE(..., 0) занизит ответ
  gold_sql: SELECT AVG(amount_counted) FROM collections

- id: m04
  category: semantics
  question: Сколько выездов инкассации завершились с расхождением между счётчиками и пересчётом?
  gold_sql: SELECT COUNT(*) FROM collections WHERE status = 'completed' AND amount_counted <> amount_declared

- id: m05
  category: semantics
  question: Сколько выездов инкассации не были завершены?
  gold_sql: SELECT COUNT(*) FROM collections WHERE status <> 'completed'
  key_facts: ["500"]

# ---------------- anomalies ----------------

- id: a01
  category: anomalies
  question: Есть ли счета, которые оплачены дважды? Покажи их номера.
  gold_sql: |
    SELECT invoice_number FROM invoices WHERE paid_at IS NOT NULL
    GROUP BY invoice_number, contract_id, amount HAVING COUNT(*) > 1

- id: a02
  category: anomalies
  question: Какой маршрут инкассации выделяется самой большой суммой недостач?
  gold_sql: |
    SELECT r.name FROM collections c JOIN routes r USING (route_id)
    WHERE c.amount_counted < c.amount_declared
    GROUP BY r.route_id ORDER BY SUM(c.amount_declared - c.amount_counted) DESC LIMIT 1
  key_facts: ["КЗН-2"]

- id: a03
  category: anomalies
  question: >-
    Есть ли признаки дробления закупок: несколько договоров одного отделения с одним поставщиком
    на один предмет, каждый чуть ниже порога 500 000 ₽ и без конкурса? Назови поставщика.
  gold_sql: |
    SELECT s.name FROM contracts c JOIN suppliers s USING (supplier_id)
    WHERE c.procurement_method = 'single_source' AND c.amount BETWEEN 450000 AND 499999
    GROUP BY c.supplier_id, c.branch_id, c.subject HAVING COUNT(*) >= 3
  key_facts: ["Пестова Ершова"]

- id: a04
  category: anomalies
  question: Есть ли поставщики, которые получили первый договор меньше чем через месяц после регистрации?
  gold_sql: |
    SELECT s.name FROM suppliers s JOIN contracts c USING (supplier_id)
    GROUP BY s.supplier_id
    HAVING julianday(MIN(c.signed_at)) - julianday(s.registered_at) < 30
  key_facts: ["Пестова Ершова"]

- id: a05
  category: anomalies
  question: Сколько выездов с недостачей было на маршруте КЗН-2 в каждом месяце 2025 года?
  gold_sql: |
    SELECT strftime('%m', c.collected_at), COUNT(*) FROM collections c JOIN routes r USING (route_id)
    WHERE r.name = 'КЗН-2' AND c.amount_counted < c.amount_declared
    GROUP BY 1

# ---------------- multi_step ----------------

- id: j01
  category: multi_step
  question: Какой госномер у машины маршрута с наибольшей суммой недостач?
  gold_sql: |
    SELECT r.vehicle_plate FROM collections c JOIN routes r USING (route_id)
    WHERE c.amount_counted < c.amount_declared
    GROUP BY r.route_id ORDER BY SUM(c.amount_declared - c.amount_counted) DESC LIMIT 1

- id: j02
  category: multi_step
  question: Какое отделение потратило больше всего на IT-оборудование?
  gold_sql: |
    SELECT b.name FROM contracts c JOIN branches b USING (branch_id)
    WHERE c.subject = 'IT-оборудование'
    GROUP BY b.branch_id ORDER BY SUM(c.amount) DESC LIMIT 1

- id: j03
  category: multi_step
  question: Какова общая сумма оплаченных счетов поставщика, с которым заключено больше всего договоров?
  gold_sql: |
    WITH top AS (
      SELECT supplier_id FROM contracts GROUP BY supplier_id ORDER BY COUNT(*) DESC LIMIT 1
    )
    SELECT SUM(i.amount) FROM invoices i JOIN contracts c USING (contract_id)
    WHERE c.supplier_id = (SELECT supplier_id FROM top) AND i.paid_at IS NOT NULL

