# ---------------- case_like ----------------

- id: c01
  category: case_like
  question: Какие договоры на ремонт заключили казанские отделения без конкурса?
  gold_sql: |
    SELECT c.contract_id, c.amount FROM contracts c JOIN branches b USING (branch_id)
    WHERE b.city = 'Казань' AND c.subject = 'Ремонт помещений' AND c.procurement_method = 'single_source'

- id: c02
  category: case_like
  question: Сколько заключено договоров на обслуживание банкоматов?
  gold_sql: SELECT COUNT(*) FROM contracts WHERE subject = 'Обслуживание банкоматов'

- id: c03
  category: case_like
  question: Какова общая сумма договоров на клининг?
  gold_sql: SELECT SUM(amount) FROM contracts WHERE subject = 'Клининговые услуги'

- id: c04
  category: case_like
  question: Сколько договоров на охрану заключено с поставщиками из Москвы?
  gold_sql: |
    SELECT COUNT(*) FROM contracts c JOIN suppliers s USING (supplier_id)
    WHERE c.subject = 'Охранные услуги' AND s.city IN ('Москва', 'г. Москва', 'москва')

